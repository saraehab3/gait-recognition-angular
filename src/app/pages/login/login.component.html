<div class="auth-container ai-grid">
  <div class="auth-glow"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon glow-cyan">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>Welcome back</h1>
      <p>Sign in to GaitID AI Platform</p>
    </div>

    <div class="card" style="border-radius:var(--radius-xl); padding:2rem">
      <form (ngSubmit)="onSubmit()" #loginForm="ngForm">

        <div class="form-group">
          <label class="form-label">Email Address</label>
          <input
            type="email" required
            [(ngModel)]="email" name="email"
            placeholder="you@example.com"
            class="form-input"
          />
        </div>

        <div class="form-group">
          <label class="form-label">Password</label>
          <div class="input-wrapper">
            <input
              [type]="showPass ? 'text' : 'password'" required
              [(ngModel)]="password" name="password"
              placeholder="••••••••"
              class="form-input"
              style="padding-right:3rem"
            />
            <button type="button" class="eye-btn" (click)="showPass = !showPass">
              <svg *ngIf="!showPass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg *ngIf="showPass" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
            </button>
          </div>
        </div>

        <div class="remember-row">
          <label class="check-label">
            <input type="checkbox" [(ngModel)]="remember" name="remember" />
            <span>Remember me</span>
          </label>
          <a href="#" class="link-cyan">Forgot password?</a>
        </div>

        <button type="submit" class="btn-primary" style="width:100%;justify-content:center;margin-top:1rem" [disabled]="loading">
          <span *ngIf="loading" class="loader"></span>
          <svg *ngIf="!loading" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:1rem;height:1rem"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/></svg>
          {{ loading ? 'Authenticating...' : 'Sign In' }}
        </button>
      </form>

      <div class="auth-switch">
        Don't have an account?
        <a routerLink="/register" class="link-cyan">Sign up</a>
      </div>
    </div>

    <p class="auth-footer-note">Graduation Project — University Security Research Platform</p>
  </div>
</div>

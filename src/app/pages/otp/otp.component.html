<div class="auth-container ai-grid">
  <div class="auth-glow"></div>

  <div class="auth-card">
    <div class="auth-logo">
      <div class="logo-icon glow-cyan">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      </div>
      <h1>Two-Factor Verification</h1>
      <p>Enter the 6-digit code sent to your email address</p>
    </div>

    <div class="card" style="border-radius:var(--radius-xl); padding:2rem">
      <div class="otp-inputs" style="margin-bottom:1.5rem">
        <input
          *ngFor="let d of otp; let i = index"
          #otpInput
          class="otp-input"
          type="text" inputmode="numeric" maxlength="1"
          [value]="otp[i]"
          (input)="onInput(i, $event)"
          (keydown)="onKeydown(i, $event)"
        />
      </div>

      <div class="otp-info">
        Code expires in <strong>5:00</strong>. Check your email inbox.
      </div>

      <button
        class="btn-primary"
        style="width:100%;justify-content:center;margin-top:1.25rem"
        (click)="onVerify()"
        [disabled]="!isComplete || loading"
      >
        <span *ngIf="loading" class="loader"></span>
        {{ loading ? 'Verifying...' : 'Verify & Continue' }}
      </button>

      <div class="resend-row">
        <button class="btn-ghost">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:.875rem;height:.875rem"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 .49-3.39"/></svg>
          Resend code
        </button>
      </div>
    </div>
  </div>
</div>
